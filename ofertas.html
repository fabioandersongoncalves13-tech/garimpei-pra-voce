<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080306">
  <meta name="description" content="Garimpei Pra Você — ofertas da Shopee selecionadas pra você.">
  <title>Ofertas da Shopee | Garimpei Pra Você</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080306;
      --card: rgba(28, 2, 9, .72);
      --border: rgba(255, 34, 72, .42);
      --red: #ff2148;
      --red-soft: #b81635;
      --text: #fff;
      --muted: #a87580;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 15%, rgba(125, 0, 28, .25), transparent 34%),
        radial-gradient(circle at 15% 75%, rgba(85, 0, 20, .16), transparent 30%),
        var(--bg);
      overflow-x: hidden;
    }

    .container {
      width: min(100% - 32px, 560px);
      margin: 0 auto;
      padding: 30px 0 40px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 22px;
      transition: color .2s ease;
    }

    .back:hover { color: #ff4665; }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 33, 72, .65);
      background: linear-gradient(145deg, #2b0610, #100207);
      box-shadow:
        0 0 0 6px rgba(255, 33, 72, .04),
        0 0 35px rgba(255, 20, 64, .18);
      font-size: 32px;
    }

    h1 {
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .tagline {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .products {
      display: grid;
      gap: 16px;
    }

    .product {
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(100deg, rgba(40, 3, 12, .88), rgba(16, 2, 7, .73));
      overflow: hidden;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .product:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 33, 72, .85);
      box-shadow: 0 12px 35px rgba(130, 0, 30, .18);
    }

    .product-photo {
      width: 100%;
      aspect-ratio: 1.6 / 1;
      object-fit: contain;
      display: block;
      padding: 14px;
      background: rgba(70, 4, 18, .35);
    }

    .product-photo-icon {
      width: 100%;
      aspect-ratio: 1.6 / 1;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(82, 5, 22, .9), rgba(20, 2, 8, .95));
      font-size: 46px;
    }

    .product-body {
      padding: 16px 18px 18px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 750;
      line-height: 1.25;
    }

    .product-desc {
      margin-top: 6px;
      color: #b98996;
      font-size: 13px;
      line-height: 1.4;
    }

    .product-footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: #ff4665;
    }

    .buy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 14px;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: background .2s ease, transform .2s ease;
    }

    .buy-btn:hover {
      background: var(--red-soft);
      transform: translateY(-2px);
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 4px 9px;
      border-radius: 20px;
      background: #ff2148;
      color: white;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      z-index: 1;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 10px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #60333d;
      font-size: 11px;
    }

    footer strong { color: #8d4654; }
  </style>
</head>

<body>
  <main class="container">
    <a class="back" href="index.html">‹ Voltar</a>

    <header>
      <div class="avatar">🛒</div>
      <h1>Ofertas da Shopee</h1>
      <p class="tagline">Achadinhos selecionados pra você ✨</p>
    </header>

    <section class="products" id="products">

      <!--
        CADA PRODUTO É UM BLOCO ASSIM. Para adicionar um novo produto,
        copie um bloco <article class="product">...</article> inteiro
        e cole antes do fechamento de </section> mais abaixo.

        - Troque o ícone (emoji dentro de "product-photo-icon") por uma
          <img class="product-photo" src="URL_DA_FOTO_REAL"> assim que
          tiver a foto de verdade do produto.
        - Troque o título, a descrição e o preço.
        - Troque o href do botão "Comprar" pelo seu link de afiliado.
        - data-added = data em que você adicionou esse produto (AAAA-MM-DD).
          O produto some sozinho da página 7 dias depois dessa data.
          Se quiser que o produto fique para sempre, apague o atributo
          data-added inteiro (o atributo, não só o valor).
      -->

    </section>

    <p class="empty-msg" id="empty-msg" style="display:none;">
      Sem ofertas no momento — volte em breve! 🔎
    </p>

    <footer>
      Feito para <strong>Garimpei Pra Você</strong> • © 2026
    </footer>
  </main>

  <script>
    (function () {
      var DAY_MS = 24 * 60 * 60 * 1000;
      var EXPIRE_DAYS = 7; // quantos dias um produto fica no ar

      document.querySelectorAll('.product[data-added]').forEach(function (item) {
        var added = new Date(item.dataset.added + 'T00:00:00');
        if (isNaN(added.getTime())) return;

        var expires = new Date(added.getTime() + EXPIRE_DAYS * DAY_MS);
        var now = new Date();
        var msLeft = expires - now;

        if (msLeft <= 0) {
          item.remove();
          return;
        }

        var daysLeft = Math.max(1, Math.ceil(msLeft / DAY_MS));
        var badge = item.querySelector('[data-badge]');
        if (badge) {
          badge.textContent = daysLeft === 1 ? 'Último dia' : daysLeft + ' dias';
        }
      });

      var remaining = document.querySelectorAll('#products .product').length;
      if (remaining === 0) {
        document.getElementById('empty-msg').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
